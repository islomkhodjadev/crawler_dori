<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dori · Цены аптек</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">✳</span><div><strong>Dori</strong><small data-i18n="brand.tag"></small></div></div>
  <label class="run-picker"><span data-i18n="run.label"></span><select id="run-select" aria-label="Run"></select></label>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="ru">RU</button><button data-lang="uz">UZ</button><button data-lang="en">EN</button>
  </div>
  <button id="logout" class="ghost" data-i18n="top.logout" hidden></button>
</header>

<nav class="tabs" aria-label="Steps">
  <button data-tab="products"><b>1</b><span data-i18n="tab.products"></span><em id="badge-products"></em></button>
  <button data-tab="connect"><b>2</b><span data-i18n="tab.connect"></span><em id="badge-connect"></em></button>
  <button data-tab="collect"><b>3</b><span data-i18n="tab.collect"></span><em id="badge-collect"></em></button>
  <button data-tab="review"><b>4</b><span data-i18n="tab.review"></span><em id="badge-review"></em></button>
  <button data-tab="results"><b>5</b><span data-i18n="tab.results"></span><em id="badge-results"></em></button>
</nav>

<div class="next-step" id="next-step"><span id="next-text"></span><button id="next-go" data-i18n="next.go"></button></div>

<main>
  <!-- 1. Products -->
  <section class="panel" data-panel="products">
    <div class="card upload">
      <div><h2 data-i18n="products.uploadTitle"></h2><p data-i18n="products.uploadHint"></p></div>
      <form id="upload-form"><input type="file" id="file" accept=".xls,.xlsx,.csv" required><button data-i18n="products.upload"></button></form>
    </div>
    <details class="card manual">
      <summary data-i18n="products.manualToggle"></summary>
      <form id="manual-form">
        <input name="name" required data-i18n-ph="products.manualName">
        <input name="manufacturer" data-i18n-ph="products.manualManufacturer">
        <input name="invoice_price" type="number" min="0" step="0.01" data-i18n-ph="products.manualPrice">
        <input name="barcode" data-i18n-ph="products.manualBarcode">
        <button data-i18n="products.manualAdd"></button>
      </form>
    </details>
    <div class="card">
      <div class="toolbar">
        <input id="search" type="search" data-i18n-ph="products.search">
        <label class="check"><input id="all-products" type="checkbox"> <span data-i18n="products.selectAll"></span></label>
        <span class="muted" id="selected-label"></span>
        <button id="to-collect" data-i18n="products.toCollect"></button>
      </div>
      <div class="table-wrap"><table class="list">
        <thead><tr><th></th><th data-i18n="col.product"></th><th class="num" data-i18n="col.ourPrice"></th><th></th></tr></thead>
        <tbody id="products"></tbody>
      </table></div>
      <p id="products-empty" class="empty" data-i18n="products.empty"></p>
    </div>
  </section>

  <!-- 2. Connect -->
  <section class="panel" data-panel="connect" hidden>
    <div class="card">
      <h2 data-i18n="connect.title"></h2>
      <ol class="how"><li data-i18n="connect.step1"></li><li data-i18n="connect.step2"></li><li data-i18n="connect.step3"></li></ol>
      <div class="toolbar">
        <label class="field"><span data-i18n="connect.testProduct"></span><select id="test-product"></select></label>
        <label class="check"><input type="checkbox" id="use-ai"> <span data-i18n="connect.useAi"></span></label>
        <small class="muted" id="ai-availability"></small>
      </div>
    </div>
    <div class="sites" id="browser-cards"></div>
  </section>

  <!-- 3. Collect -->
  <section class="panel" data-panel="collect" hidden>
    <div class="card">
      <h2 data-i18n="collect.title"></h2>
      <div class="collect-setup">
        <div><span class="label" data-i18n="collect.productsLabel"></span><strong id="collect-selected"></strong> <button class="link" data-goto="products" data-i18n="collect.change"></button></div>
        <div><span class="label" data-i18n="collect.sites"></span><span id="collect-sites"></span></div>
      </div>
      <p class="warn" id="collect-blocker" hidden></p>
      <div class="row-actions"><button id="crawl" class="big" data-i18n="collect.start"></button><button id="cancel-run" class="danger" data-i18n="collect.cancel" hidden></button></div>
    </div>
    <div class="card">
      <div class="progress-head"><h3 id="progress-label"></h3><span class="muted" id="elapsed-label"></span></div>
      <progress id="run-progress" value="0" max="100"></progress>
      <p class="muted" id="active-work"></p>
      <div class="alert" id="waiting-alert" hidden><span id="waiting-text"></span><button id="waiting-open"></button></div>
      <div class="metrics">
        <div><span data-i18n="collect.mChecked"></span><strong id="m-checked">0</strong></div>
        <div><span data-i18n="collect.mMatched"></span><strong id="m-matched">0</strong></div>
        <div class="hl"><span data-i18n="collect.mReview"></span><strong id="m-review">0</strong></div>
        <div><span data-i18n="collect.mErrors"></span><strong id="m-errors">0</strong></div>
      </div>
      <details class="more"><summary data-i18n="collect.details"></summary>
        <div class="table-wrap"><table class="list compact"><thead><tr><th data-i18n="col.site"></th><th class="num" data-i18n="collect.searches"></th><th class="num" data-i18n="collect.ok"></th><th class="num" data-i18n="collect.noResults"></th><th class="num" data-i18n="collect.mErrors"></th><th class="num" data-i18n="collect.listings"></th></tr></thead><tbody id="source-statistics"></tbody></table></div>
        <h4 data-i18n="collect.recent"></h4><div id="activity-log" class="activity"></div>
      </details>
    </div>
  </section>

  <!-- 4. Review -->
  <section class="panel" data-panel="review" hidden>
    <div class="card intro"><h2 data-i18n="review.title"></h2><p data-i18n="review.intro"></p></div>
    <div id="review-queue" class="review-list"></div>
  </section>

  <!-- 5. Results -->
  <section class="panel" data-panel="results" hidden>
    <div class="card">
      <div class="toolbar">
        <h2 data-i18n="results.title"></h2>
        <select id="report-filter" aria-label="Filter"></select>
        <span class="spacer"></span>
        <button id="advice-all" class="ghost" data-i18n="advice.all"></button>
        <a class="button ghost" id="export-candidates" href="/api/export/candidates" data-i18n="results.exportAll"></a>
        <a class="button" id="export" href="/api/export" data-i18n="results.export"></a>
      </div>
      <div class="table-wrap"><table class="list results">
        <thead><tr><th data-i18n="col.product"></th><th class="num" data-i18n="col.ourPrice"></th><th class="num">Arzon</th><th class="num">Oson</th><th class="num" data-i18n="col.market"></th><th class="num" data-i18n="col.optimal"></th><th class="num" data-i18n="col.vsOurs"></th><th data-i18n="col.status"></th></tr></thead>
        <tbody id="reports"></tbody>
      </table></div>
      <p id="results-empty" class="empty" hidden></p>
    </div>
  </section>
</main>

<div id="toast" role="status" hidden></div>

<dialog id="ai-dialog"><h3 data-i18n="ai.title"></h3><p class="muted" data-i18n="ai.note"></p><pre id="ai-result"></pre><button id="close-dialog" data-i18n="viewer.close"></button></dialog>

<dialog id="browser-dialog">
  <div class="viewer-bar"><strong id="browser-title"></strong><span class="spacer"></span><button id="browser-home" class="ghost" data-i18n="viewer.home"></button><button id="browser-reload" class="ghost" data-i18n="viewer.reload"></button><button id="browser-close" class="ghost" data-i18n="viewer.close"></button></div>
  <p id="browser-url" class="muted"></p>
  <p id="browser-notice"></p>
  <div id="remote-control" tabindex="0" aria-label="Remote browser"><img id="remote-screen" alt=""></div>
  <form id="browser-text-form"><input id="browser-text" autocomplete="off" data-i18n-ph="viewer.type"><button data-i18n="viewer.send"></button><button type="button" id="browser-enter" class="ghost">Enter ↵</button><button type="button" id="browser-tab" class="ghost">Tab</button><button type="button" id="browser-check" data-i18n="connect.check"></button></form>
</dialog>

<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
