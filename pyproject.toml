[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crawler-dori"
version = "0.1.0"
description = "Excel-driven pharmacy comparison and current market price estimation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "xlrd>=2.0,<3", "openpyxl>=3.1,<4", "rapidfuzz>=3.12,<4", "playwright>=1.51,<2", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
dori = "dori.cli:main"

[tool.setuptools.package-data]
dori = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
